# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Explicit workflow permissions (as little as required)
permissions:
  contents: read

# A new commit on a pull request stops the run of the previous commit
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Only for pushes (assumes protected main branch) and for PRs from this repo (not from forks)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v7
      with:
        # Do not keep the token on the runner after the checkout
        persist-credentials: false

    # Pinned to a commit SHA: a tag or branch of a third-party action can change
    - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    - name: Swift Version
      run: swift -version
   # - name: Build
   #   run: swift build -Xswiftc "-sdk" -Xswiftc "`xcrun --sdk iphonesimulator --show-sdk-path`" -Xswiftc "-target" -Xswiftc "x86_64-apple-ios14.0-simulator"
      #run: xcodebuild -destination "platform=iOS Simulator,name=iPhone SE (3rd generation),OS=18.1" -scheme DataCapturing SYMROOT="./build" build
    - name: Build & Test 
      run: xcodebuild clean test -scheme "DataCapturing" -destination "platform=iOS Simulator,name=iPhone SE (3rd generation),OS=26.1" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=NO

    - name: Archive Test Log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-log
        path: /Users/runner/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
        # Only 7 days, to keep the storage small
        retention-days: 7

